# golangci-lint v2 configuration. The linters here are the set this package has
# always run; those that have since been retired are covered by the ones that
# replaced them: deadcode, structcheck and varcheck by unused, golint and
# stylecheck by staticcheck, and megacheck by staticcheck and unused together.
version: "2"

run:
  concurrency: 4
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    errcheck:
      # An unchecked type assertion panics rather than returning an error.
      check-type-assertions: true
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    govet:
      enable:
        - shadow
    lll:
      line-length: 160
      tab-width: 4

  exclusions:
    generated: lax
    rules:
      # A test says what it means more plainly without these.
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - lll
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - gocritic
        text: "can combine chain of . appends into one"
      - linters:
          - lll
        source: "^//go:generate "

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
